name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

  ci:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  publish-npm:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/oatschema
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@^11.5.1
      - run: npm ci
      - name: Skip a version that is already on npm
        id: published
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "oatschema@$version" version >/dev/null 2>&1; then
            echo "oatschema@$version is already on npm; skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
