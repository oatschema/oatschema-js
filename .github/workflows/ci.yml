name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      OATS_REPO: ${{ github.workspace }}/../oats
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Clone oats for the release-tag tests
        run: git clone --quiet https://github.com/oatschema/oats "$OATS_REPO"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - run: npx --yes jsr@0.14.3 publish --dry-run
