name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      OATS_REPO: ${{ github.workspace }}/../oats
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Clone oats for the release-tag tests
        run: git clone --quiet https://github.com/oatschema/oats "$OATS_REPO"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the conformance corpus against oatschema-py
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'oatschema[validate]==0.8.0.1' 'jsonschema-rs==0.59.0'
          "$RUNNER_TEMP/venv/bin/python" scripts/check_corpus.py
